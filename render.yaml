# Render Blueprint Configuration (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec

version: "1"

services:
  # ==============================================================
  # 1. Course Microservice (Independent Backend API)
  # ==============================================================
  - type: web
    name: course-service
    runtime: node
    plan: free
    rootDir: course-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: MONGO_URI
        sync: false # Set in Render Dashboard: MongoDB Atlas URI for course_db

  # ==============================================================
  # 2. Student Microservice (Communicates with Course Service via REST)
  # ==============================================================
  - type: web
    name: student-service
    runtime: node
    plan: free
    rootDir: student-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: MONGO_URI
        sync: false # Set in Render Dashboard: MongoDB Atlas URI for student_db
      - key: COURSE_SERVICE_URL
        sync: false # Set in Render Dashboard: Course Service URL (e.g., https://course-service-xxxx.onrender.com)

  # ==============================================================
  # 3. React Frontend Dashboard (Static Site)
  # ==============================================================
  - type: web
    name: student-course-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_STUDENT_SERVICE_URL
        sync: false # Set in Render Dashboard: Student Service URL (e.g., https://student-service-xxxx.onrender.com)
      - key: VITE_COURSE_SERVICE_URL
        sync: false # Set in Render Dashboard: Course Service URL (e.g., https://course-service-xxxx.onrender.com)
